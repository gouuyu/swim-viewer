<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>レース分析ビューアー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
         background: #f0f4f8; color: #1a1a2e; font-size: 14px; }

  #loading, #error { display: flex; align-items: center; justify-content: center;
                     height: 100vh; font-size: 16px; color: #555; text-align: center; padding: 20px; }
  #error { color: #c0392b; }
  #content { display: none; padding: 12px; max-width: 600px; margin: 0 auto; }

  /* ヘッダー */
  .header { background: linear-gradient(135deg, #1A5276, #2980b9);
            color: white; border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .header h1 { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .header .meta { font-size: 12px; opacity: 0.85; line-height: 1.8; }

  /* セクション */
  .section { background: white; border-radius: 12px; padding: 14px;
             margin-bottom: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
  .section-title { font-size: 12px; font-weight: 700; color: #1A5276;
                   text-transform: uppercase; letter-spacing: 0.5px;
                   border-bottom: 2px solid #1A5276; padding-bottom: 6px; margin-bottom: 10px; }

  /* レースタイム大表示 */
  .race-time { text-align: center; padding: 8px 0; }
  .race-time .time { font-size: 36px; font-weight: 700; color: #1A5276; letter-spacing: 2px; }
  .race-time .label { font-size: 11px; color: #888; margin-top: 2px; }

  /* カードグリッド */
  .card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card { background: #eaf0fb; border-radius: 8px; padding: 10px; text-align: center; }
  .card .val { font-size: 18px; font-weight: 700; color: #1A5276; }
  .card .lbl { font-size: 10px; color: #666; margin-top: 2px; }

  /* テーブル */
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th { background: #1A5276; color: white; padding: 6px 8px; text-align: center; font-weight: 600; }
  td { padding: 5px 8px; text-align: center; border-bottom: 1px solid #f0f0f0; }
  tr:nth-child(even) td { background: #f7f9fc; }
  tr:last-child td { border-bottom: none; }
  .label-cell { text-align: left; color: #444; }

  /* ストローク分析 */
  .stroke-group-header { background: #d6eaf8; font-weight: 700; color: #1A5276; }
  .good { color: #1E8449; font-weight: 600; }
  .bad  { color: #C0392B; font-weight: 600; }

  /* フッター */
  .footer { text-align: center; color: #aaa; font-size: 10px; padding: 16px 0; }
</style>
</head>
<body>

<div id="loading">データを読み込み中...</div>
<div id="error"></div>
<div id="content"></div>

<script>
const SUPABASE_URL = "https://gxvrqmpdarvqcxeyvigk.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4dnJxbXBkYXJ2cWN4ZXl2aWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYwODc0NTYsImV4cCI6MjEwMTY2MzQ1Nn0.oh3V062aHMySVN4cFOivu8oal3yeGa7SgXIkTvi3grg";

// URLからトークン取得 (/r/{token})
function getToken() {
  const m = location.pathname.match(/\/r\/([0-9a-f-]{36})/i);
  return m ? m[1] : null;
}

// 時間フォーマット (秒 → MM:SS.ss)
function fmtTime(s) {
  if (s == null) return "-";
  const m = Math.floor(s / 60);
  const sec = (s % 60).toFixed(2).padStart(5, "0");
  return m > 0 ? `${m}:${sec}` : `${sec}`;
}

function fmtVal(v, d = 2) {
  return v == null ? "-" : Number(v).toFixed(d);
}

// タイミングから計算
function calcRaceTime(timing) {
  const keys = Object.keys(timing).filter(k => k !== "シグナル");
  if (!keys.length) return null;
  const last = timing[keys[keys.length - 1]];
  const sig  = timing["シグナル"] ?? 0;
  return (last != null && sig != null) ? last - sig : null;
}

function calcLap50m(timing) {
  const laps = {};
  const pts50 = Object.entries(timing)
    .filter(([k]) => /^\d+m$/.test(k) && parseInt(k) % 50 === 0)
    .sort((a, b) => parseInt(a[0]) - parseInt(b[0]));
  let prev = { key: "シグナル", val: timing["シグナル"] ?? 0 };
  for (const [key, val] of pts50) {
    if (val != null && prev.val != null)
      laps[`${prev.key}→${key}`] = val - prev.val;
    prev = { key, val };
  }
  return laps;
}

// ストローク区間計算
function calcStroke(sec) {
  const { start_distance, end_distance, start_time, end_time } = sec;
  if (start_time == null || end_time == null) return null;
  const dur  = end_time - start_time;
  const dist = end_distance - start_distance;
  const splitTime = (() => {
    // タイミングからこの区間のスプリットタイムを推定（ストローク区間の中間）
    return null; // 直接計算不可のためnull
  })();
  const ST = dur / 3;
  // SVはスプリットタイムが必要なため省略、ここではST/SLは計算できない
  return { ST };
}

// ストローク分析テーブル行
function strokeRows(sections, timing) {
  // 各区間のSVを計算するためにタイミングを使う
  const rows = [];
  for (const sec of sections) {
    if (sec.start_time == null || sec.end_time == null) {
      rows.push({ label: sec.label, SV: null, ST: null, SL: null });
      continue;
    }
    const dur = sec.end_time - sec.start_time;
    const ST  = dur / 3;

    // SVを計算するために直前の50mタイム差を使う
    // sec.start_distanceとend_distanceを含む区間のスプリットを探す
    const startDist = sec.start_distance;
    const endDist   = sec.end_distance;
    // タイミングポイントから前後を探す
    const tEntries = Object.entries(timing)
      .filter(([k]) => /^\d+m$/.test(k))
      .map(([k, v]) => [parseInt(k), v])
      .sort((a, b) => a[0] - b[0]);

    let prevM = null, prevT = null, nextM = null, nextT = null;
    const sig = timing["シグナル"] ?? 0;
    for (const [m, t] of tEntries) {
      if (m <= startDist) { prevM = m; prevT = t; }
      if (m >= endDist && nextM == null) { nextM = m; nextT = t; }
    }

    let SV = null, SL = null;
    if (prevM != null && nextM != null && prevT != null && nextT != null) {
      const sectionDist = nextM - (prevM === 0 ? 0 : prevM);
      const sectionTime = nextT - prevT;
      if (sectionTime > 0) {
        SV = (nextM - (prevM || 0)) / sectionTime;
        // もっと精度よく: ストローク区間の距離のみ
        const strokeDist = endDist - startDist;
        SV = strokeDist / (sectionTime * strokeDist / (nextM - (prevM || 0)));
        // 単純に: SV = stroke_dist / (stroke_dist / section_dist * section_time)
        SV = sectionDist > 0 ? strokeDist / (sectionTime * strokeDist / sectionDist) : null;
        // 最もシンプル: 区間距離 / 区間タイム  (近似)
        SV = sectionDist > 0 ? sectionDist / sectionTime : null;
        SL = SV != null ? SV * ST : null;
      }
    }

    rows.push({ label: sec.label, SV, ST, SL });
  }
  return rows;
}

function showError(msg) {
  document.getElementById("loading").style.display = "none";
  const el = document.getElementById("error");
  el.innerHTML = `<div>⚠️ ${msg}</div>`;
  el.style.display = "flex";
}

async function load() {
  const token = getToken();
  if (!token) { showError("URLが正しくありません"); return; }

  try {
    const url = `${SUPABASE_URL}/rest/v1/race_sessions?share_token=eq.${token}&select=*`;
    const res = await fetch(url, {
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const rows = await res.json();
    if (!rows.length) { showError("データが見つかりません"); return; }
    render(rows[0].data, rows[0]);
  } catch(e) {
    showError(`読み込み失敗: ${e.message}`);
  }
}

function render(data, meta) {
  const a       = data.athlete || {};
  const timing  = data.timing  || {};
  const sections = data.stroke_sections || [];
  const sc      = data.stroke_counts || {};

  const raceTime  = calcRaceTime(timing);
  const laps      = calcLap50m(timing);
  const strokes   = strokeRows(sections, timing);

  // 前後半
  const pts50 = Object.keys(timing).filter(k => /^\d+m$/.test(k) && parseInt(k) % 50 === 0)
                       .sort((a,b) => parseInt(a) - parseInt(b));
  const midPt = pts50[Math.floor(pts50.length / 2)];
  const sig   = timing["シグナル"] ?? 0;
  const firstHalf  = midPt && timing[midPt] != null ? timing[midPt] - sig : null;
  const lastPt     = pts50[pts50.length - 1];
  const secondHalf = (midPt && lastPt && timing[midPt] != null && timing[lastPt] != null)
                     ? timing[lastPt] - timing[midPt] : null;

  document.title = `${a.name || "選手"} - ${a.event || ""} レース分析`;

  const html = `
    <div class="header">
      <h1>${a.name || "選手名未設定"} <span style="font-size:14px;opacity:.8">${a.event || ""}</span></h1>
      <div class="meta">
        ${a.competition ? `🏆 ${a.competition}` : ""}
        ${a.date        ? `　📅 ${a.date}` : ""}
        ${a.round_name  ? `　${a.round_name}` : ""}
      </div>
    </div>

    <!-- レースタイム -->
    <div class="section">
      <div class="section-title">レース結果</div>
      <div class="race-time">
        <div class="time">${fmtTime(raceTime)}</div>
        <div class="label">レースタイム</div>
      </div>
      ${(firstHalf != null || secondHalf != null) ? `
      <div class="card-grid" style="margin-top:12px">
        <div class="card">
          <div class="val">${fmtTime(firstHalf)}</div>
          <div class="lbl">前半 ${midPt || ""}</div>
        </div>
        <div class="card">
          <div class="val">${fmtTime(secondHalf)}</div>
          <div class="lbl">後半 ${midPt || ""}→${lastPt || ""}</div>
        </div>
      </div>` : ""}
    </div>

    <!-- 50mラップ -->
    ${Object.keys(laps).length ? `
    <div class="section">
      <div class="section-title">50mラップ</div>
      <table>
        <tr><th>区間</th><th>タイム</th></tr>
        ${Object.entries(laps).map(([k,v]) =>
          `<tr><td class="label-cell">${k}</td><td>${fmtTime(v)}</td></tr>`
        ).join("")}
      </table>
    </div>` : ""}

    <!-- 通過タイム -->
    <div class="section">
      <div class="section-title">通過タイム</div>
      <table>
        <tr><th>ポイント</th><th>通過時刻</th></tr>
        ${Object.entries(timing).filter(([k]) => k !== "シグナル").map(([k,v]) =>
          `<tr><td class="label-cell">${k}</td><td>${fmtTime(v)}</td></tr>`
        ).join("")}
      </table>
    </div>

    <!-- ストローク分析 -->
    ${strokes.some(s => s.SV != null || s.ST != null) ? `
    <div class="section">
      <div class="section-title">ストローク分析</div>
      <table>
        <tr><th>区間</th><th>SV (m/s)</th><th>ST (s)</th><th>SL (m)</th></tr>
        ${strokes.map(s =>
          `<tr>
            <td class="label-cell">${s.label}</td>
            <td>${fmtVal(s.SV)}</td>
            <td>${fmtVal(s.ST)}</td>
            <td>${fmtVal(s.SL)}</td>
          </tr>`
        ).join("")}
      </table>
    </div>` : ""}

    <!-- ストローク数 -->
    ${Object.keys(sc).length && Object.values(sc).some(v => v != null) ? `
    <div class="section">
      <div class="section-title">ストローク数</div>
      <table>
        <tr><th>ラップ</th><th>S数</th></tr>
        ${Object.entries(sc).filter(([,v]) => v != null).map(([k,v]) =>
          `<tr><td class="label-cell">${k}</td><td>${v}</td></tr>`
        ).join("")}
      </table>
    </div>` : ""}

    <div class="footer">Swim Analyzer — ${new Date(meta.created_at).toLocaleDateString("ja-JP")}</div>
  `;

  document.getElementById("loading").style.display = "none";
  const content = document.getElementById("content");
  content.innerHTML = html;
  content.style.display = "block";
}

load();
</script>
</body>
</html>
